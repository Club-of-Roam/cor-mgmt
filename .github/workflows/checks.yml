name: Plugin reference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check metadata, syntax and documentation
        run: composer check
      - name: Run isolated characterization tests
        run: composer test
